<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;600&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#141414;color:#f4f1ec;font-family:"Inter Tight",sans-serif;overflow:hidden;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(244,241,236,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(244,241,236,.05) 1px,transparent 1px);background-size:42px 42px}
  .stack{position:absolute;left:56px;top:52px;width:560px;height:526px;background:#faf8f4;padding:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
  .stack .ceil{height:300px;background:url(kf3.webp) center/cover}
  .stack .wall{height:10px;background:#faf8f4}
  .stack .floor{height:192px;background:url(e3.jpg) center 40%/cover;position:relative}
  .cap{position:absolute;left:56px;top:590px;font:400 11px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,236,.6)}
  .right{position:absolute;left:668px;top:52px;right:56px;bottom:52px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:12px;font:600 15px/1 "Inter Tight";letter-spacing:.22em}
  h1{font:400 84px/0.92 "Instrument Serif",serif;letter-spacing:-.02em}
  h1 em{font-style:italic}
  .sub{font:400 13px/1.6 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,241,236,.72)}
  .rule{height:2px;width:72px;background:#c8102e;margin-bottom:18px}
</style></head>
<body><div class="grid"></div>
<div class="stack"><div class="ceil"></div><div class="wall"></div><div class="floor"></div></div>
<div class="cap">Illustrative render</div>
<div class="right">
  <div class="mark"><svg viewBox="0 0 46 18" width="40" height="16"><path d="M1.2 15.6C8.6 14.4 17.4 11.2 27.6 7.1c.8-.3 1.5.9.7 1.3C18.6 13 9.5 16.3 1.6 17.4c-1 .1-1.4-1.6-.4-1.8Z" fill="#c8102e"/><path d="M28.6 5.2 43.8 1.6c.6-.1 1.1.3 1.1.9v6.9c0 .6-.6 1-1.2.8L29 7.6Z" fill="#f4f1ec"/></svg>ASHTON INNOVATIONS</div>
  <h1>Look up.<br><em>Look down.</em></h1>
  <div><div class="rule"></div><div class="sub">Decorative drywall, painting<br>&amp; epoxy floors<br>Fredericksburg, Virginia</div></div>
</div>
</body></html>
